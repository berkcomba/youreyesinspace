# Security headers — `always` so they are also sent on error responses.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS is enforced at the Cloudflare edge as well; keep it here for direct hits.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
# The app is a self-contained WebGL bundle: no third-party scripts, styles or frames.
# `blob:` workers are used by the Draco decoder; `data:` for generated textures/images.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://gibs.earthdata.nasa.gov https://trek.nasa.gov; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
