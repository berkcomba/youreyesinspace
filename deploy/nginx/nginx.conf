worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  types {
    model/gltf-binary glb;
  }

  # JSON access log (Cloud Logging parses it as structured payload)
  log_format json escape=json
    '{"time":"$time_iso8601","status":$status,"method":"$request_method","uri":"$uri",'
    '"bytes":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent",'
    '"ref":"$http_referer","cf_ip":"$http_cf_connecting_ip","ray":"$http_cf_ray"}';
  access_log /dev/stdout json;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 1m;
  client_body_buffer_size 16k;
  large_client_header_buffers 4 8k;

  # Compression (Cloudflare re-compresses with Brotli at the edge; gzip covers direct hits)
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/javascript application/javascript application/json
    application/manifest+json image/svg+xml application/wasm model/gltf-binary
    application/octet-stream;

  # Only trust CF-Connecting-IP when the hop came from Cloudflare (or the Cloud Run proxy)
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 0.0.0.0/0;

  include /etc/nginx/conf.d/*.conf;
}
